<!DOCTYPE html>
<html>
<head>
    <title>로그인 | EveryMore</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial,sans-serif;
            background:linear-gradient(135deg,#74b9ff,#a29bfe);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:20px;
        }

        .card{

            width:100%;
            max-width:500px;

            background:white;

            border-radius:30px;

            padding:40px;

            box-shadow:
                0 15px 35px rgba(0,0,0,0.15);
        }

        .logo{

            text-align:center;

            margin-bottom:30px;
        }

        .logo h1{

            color:#6c5ce7;

            font-size:40px;
        }

        .logo p{

            color:#636e72;

            margin-top:5px;
        }

        .form-group{

            margin-bottom:20px;
        }

        label{

            display:block;

            margin-bottom:8px;

            font-weight:bold;

            color:#2d3436;
        }

        input{

            width:100%;

            padding:14px;

            border:1px solid #ddd;

            border-radius:12px;

            font-size:16px;
        }

        input:focus{

            outline:none;

            border-color:#6c5ce7;
        }

        .btn{

            width:100%;

            border:none;

            padding:15px;

            border-radius:12px;

            background:#6c5ce7;

            color:white;

            font-size:16px;

            font-weight:bold;

            cursor:pointer;
        }

        .btn:hover{
            opacity:.9;
        }

        .error{

            color:#e74c3c;

            margin-bottom:15px;

            text-align:center;
        }

        .bottom{

            margin-top:25px;

            text-align:center;
        }

        .bottom a{

            color:#6c5ce7;

            text-decoration:none;

            font-weight:bold;
        }

    </style>

</head>
<body>

<div class="card">

    <div class="logo">

        <h1>EveryMore</h1>

        <p>로그인</p>

    </div>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    <form method="post">

        {% csrf_token %}

        <div class="form-group">

            <label>아이디</label>

            <input
                type="text"
                name="username"
                required
            >

        </div>

        <div class="form-group">

            <label>비밀번호</label>

            <input
                type="password"
                name="password"
                required
            >

        </div>

        <button
            type="submit"
            class="btn"
        >
            로그인
        </button>

    </form>

    <div class="bottom">

        계정이 없나요?

        <a href="{% url 'signup' %}">
            회원가입
        </a>

    </div>

</div>

</body>
</html>
